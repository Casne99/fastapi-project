name: CI

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop, "feature/*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      PYTHONPATH: src/backend/app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
      - name: Set profile
        run: echo "ci" > src/backend/profile
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - name: Run Alembic migrations
        run: |
          cd src/backend
          alembic upgrade head
      - name: Run tests
        run: |
          cd src/backend
          pytest tests

  playwright:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build db backend gui nginx

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs && break
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      - name: Run Playwright tests
        run: docker compose run --rm frontend-tests

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/test-results/

      - name: Stop services
        if: always()
        run: docker compose down -v

