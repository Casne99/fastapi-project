version: "3.9"

services:

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  backend:
    build: ./src/backend
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
    networks:
      - app-network

  gui:
    build: ./src/frontend/gui
    container_name: gui_frontend
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - gui
    networks:
      - app-network

  frontend-tests:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile.playwright
    environment:
      - PLAYWRIGHT_BASE_URL=http://nginx
    depends_on:
      - gui
      - backend
      - nginx
    shm_size: "1gb"
    ipc: host
    volumes:
      - ./src/frontend/test-results:/app/test-results
      - ./src/frontend/playwright-report:/app/playwright-report
    networks:
      - app-network
    command: ["npm", "run", "test:docker"]

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: